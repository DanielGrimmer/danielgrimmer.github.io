# Social and academic profile links, shown in the order defined here.
# Docs: https://github.com/george-gca/jekyll-socials

# `email:` is deliberately NOT set. jekyll-socials would emit a bare
# <a href="mailto:daniel.grimmer@yale.edu">, which al-folio's protect_email does
# not rewrite — so the address would sit in the HTML for harvesters exactly as
# the old Oxford site was careful to avoid. The address appears instead as
# "daniel.grimmer (at) yale.edu" on the homepage and CV. Setting this key again
# restores the envelope icon and undoes that.
github_username: DanielGrimmer
youtube_id: oxfordspacetime
orcid_id: 0000-0002-8449-3775
scholar_userid: -R31VGwAAAAJ # Google Scholar

cv_pdf: /assets/pdf/CV_Grimmer.pdf # the old site's "Long CV" link

# Uncomment and fill if you want these too:
# philpeople_id:
# bluesky_url:
# linkedin_username:

# rss_icon: true # jekyll-socials renders any key that is PRESENT, so this must
