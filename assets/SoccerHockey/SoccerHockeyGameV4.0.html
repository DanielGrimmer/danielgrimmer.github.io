<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Soccer Hockey Duality Game (V4.0)</title>
    <link rel="stylesheet" href="../games/ui/board.css?v=4.18.0" />
  </head>
  <body class="dg">
    <div class="dg-wrap">
      <header class="dg-masthead">
        <div>
          <h1 id="sportTitle">Soccer Hockey</h1>
          <div class="dg-sub" id="sportSub">Connecting…</div>
        </div>
        <a href="/soccer-hockey/">← Soccer Hockey</a>
      </header>

      <div class="dg-layout" id="playLayout">
        <div class="dg-coach" id="coach" aria-live="polite">
          <div class="dg-coach-progress" id="coachProgress">Room</div>
          <h2 class="dg-coach-title" id="roomName">…</h2>
          <p class="dg-coach-body" id="coachBody">Finding you a room…</p>

          <div class="dg-room-tools" id="roomTools" hidden>
            <button class="dg-btn dg-btn-primary" id="copyLink" type="button">Copy the invite link</button>
            <label class="dg-join">
              Or join a room by name:
              <span class="dg-join-row">
                <input id="roomInput" list="roomList" placeholder="GreenField" autocomplete="off" />
                <button class="dg-btn" id="joinRoom" type="button">Join</button>
              </span>
            </label>
            <datalist id="roomList"></datalist>
          </div>
        </div>

        <div class="dg-play">
          <div class="dg-status" id="status">Connecting…</div>
          <div class="dg-presence" id="presence"></div>
          <div id="board"></div>
        </div>
      </div>

      <!--
        The reveal. Hidden until the game is over, and then it replaces the
        board rather than sitting under it: there is nothing left to play, and
        the two replay boards want the whole width.
      -->
      <section id="replay" hidden>
        <!--
          The reading holds the site's measure and sits centred over the boards;
          only the boards themselves take the extra width.
        -->
        <div class="dg-replay-intro">
          <div class="dg-status" id="replayStatus"></div>
          <div class="dg-coach dg-coach-band" id="replayCoach">
            <div class="dg-coach-progress">The Big Reveal</div>
            <h2 class="dg-coach-title" id="replayTitle"></h2>
            <p class="dg-coach-body" id="replayBody"></p>
          </div>
        </div>
        <div id="replayStage"></div>
        <!--
          The questions the boards raise, kept until after somebody has stepped
          through them. Reaching the boards quickly is what makes the reveal
          land; this keeps perfectly well until afterwards.
        -->
        <div class="dg-replay-intro">
          <div class="dg-coach dg-coach-band">
            <p class="dg-coach-body" id="replayAfter"></p>
          </div>
        </div>
        <!--
          Where to go once the reveal has landed. The room name travels with the
          link, so following it puts both players in the same sandbox.
        -->
        <div class="dg-bar dg-bar-main">
          <a class="dg-btn dg-btn-primary" id="toSandbox" href="SoccerHockeySandboxV4.0.html">
            Let's Look under the Hood →
          </a>
        </div>
      </section>

      <div class="dg-bar dg-bar-main">
        <button class="dg-btn" id="newGame" type="button" hidden>New game</button>
        <button class="dg-btn" id="leave" type="button" hidden>Leave this room</button>
      </div>

      <p class="dg-legend dg-build">Build <span id="buildStamp">—</span></p>
    </div>

    <script type="module">
      const BUILD = '4.18.0';

      import { SOCCER_HOCKEY } from '../games/core/presets.js?v=4.18.0';
      import {
        initialGame,
        replay,
        replayFrames,
        viewOf,
        squareFromView,
        STATUS,
      } from '../games/core/game.js?v=4.18.0';
      import {
        presenceOf,
        seatOf,
        normaliseSeats,
        occupancy,
        mayMove,
        PRESENCE,
      } from '../games/core/seats.js?v=4.18.0';
      import { createBoardView } from '../games/ui/board.js?v=4.18.0';
      import { createReplayView, moverAt } from '../games/ui/replay.js?v=4.18.0';
      import { replayNote } from '../games/ui/coach.js?v=4.18.0';
      import {
        ROOM_NAMES,
        roomFromLocation,
        shareLink,
        rememberRoom,
        recallRoom,
      } from '../games/net/rooms.js?v=4.18.0';
      import {
        signIn,
        chooseRoom,
        joinRoom,
        heartbeat,
        leaveRoom,
        appendMove,
        resetRoom,
        watchRoom,
        explain,
        HEARTBEAT_MS,
        ACTIVE_HEARTBEAT_MS,
      } from '../games/net/room.js?v=4.18.0';

      const config = SOCCER_HOCKEY;
      const el = (id) => document.getElementById(id);

      let uid = null;
      let room = null; // the room's name
      let seat = null; // 0, 1, or null for a spectator
      let state = { seats: normaliseSeats([]), moves: [] };
      let game = initialGame(config);
      let boardView = null;
      let replayView = null;
      let replayKey = null; // what the replay on screen is currently showing
      /*
       * True when the game in this room was already finished at the moment we
       * sat down — somebody else's game, which we have no business being shown
       * the reveal of. Cleared the moment a fresh game starts, which is the one
       * way the log can return to empty.
       */
      let inheritedGame = false;
      let unwatch = null;
      let interacted = false; // has anyone touched this tab since the last beat

      const now = () => Date.now();

      /* ---------------------------------------------------------- rendering */

      function sportOf(index) {
        return config.seats[index]?.sport ?? 'Spectating';
      }

      function cornerOf(index) {
        return config.seats[index]?.goalCorner ?? '';
      }

      function describeOpponent() {
        if (seat === null) return '';
        const them = state.seats[seat === 0 ? 1 : 0];
        switch (presenceOf(them, now())) {
          case PRESENCE.EMPTY:
            return 'Nobody else is here yet.';
          case PRESENCE.ACTIVE:
            return 'Your opponent is here, and moving about.';
          case PRESENCE.IDLE:
            return 'Your opponent is here but has been still for a while.';
          case PRESENCE.GONE:
            return 'Your opponent has stopped responding. Their seat frees up after five minutes.';
          default:
            return '';
        }
      }

      function describeStatus() {
        if (seat === null) {
          return 'Both seats in this room are taken — you are watching. Join another room to play.';
        }
        // The result comes first: a finished game stays finished even after the
        // other player closes their tab, and the replay underneath would look
        // absurd above the words "waiting for a second player".
        const callThem = 'Call your friend, to talk through your respective experiences.';
        if (game.outcome.status === STATUS.WON) {
          return game.outcome.winner === seat
            ? `You win! ${callThem}`
            : `Your opponent wins. ${callThem}`;
        }
        if (game.outcome.status === STATUS.TIE) return `Nobody can move — a draw. ${callThem}`;
        const full = occupancy(state.seats, now()).held === 2;
        if (!full) return 'Waiting for a second player to join this room.';
        // Which way you are heading is the thing players lose track of: the
        // sport you were handed says nothing about it, and it need not match
        // the side you had in the tutorial. So it is repeated every turn.
        return game.turn === seat
          ? `Your move. You are heading for the goal at the ${cornerOf(seat)}.`
          : `Your opponent's move. They are heading for the ${cornerOf(seat === 0 ? 1 : 0)}.`;
      }

      function draw() {
        game = replay(config, state.moves);
        const lens = seat ?? 0;

        if (!boardView) {
          boardView = createBoardView(el('board'), {
            board: config.board,
            theme: config.seats[lens].theme,
          });
        }

        // `mayMove` asks whether this uid holds *the seat on move* and is still
        // beating, which is the same question the Security Rule asks. Restating
        // it here as `game.turn === seat` was a second copy of a rule that has
        // one home.
        const full = occupancy(state.seats, now()).held === 2;
        const mayMoveNow =
          full &&
          game.outcome.status === STATUS.PLAYING &&
          mayMove(state.seats, { uid, turn: game.turn, now: now() });

        boardView.render(viewOf(config, game, lens), {
          onSquare: mayMoveNow
            ? async (viewSquare) => {
                const square = squareFromView(config, lens, viewSquare);
                try {
                  await appendMove({
                    name: room,
                    uid,
                    move: { row: square.row, col: square.col },
                    expectedLength: state.moves.length,
                  });
                } catch (err) {
                  // Someone moved first, or the rules refused it. The snapshot
                  // that follows is the truth; say so rather than freezing.
                  el('status').textContent = `That move did not take: ${explain(err)}`;
                }
              }
            : null,
        });

        el('status').textContent = inheritedGame
          ? 'This room still has somebody else\u2019s finished game in it. Press ' +
            '\u201cNew game\u201d to clear the board and start your own.'
          : describeStatus();
        el('status').dataset.tone =
          !inheritedGame && game.outcome.status === STATUS.WON ? 'win' : '';
        el('presence').textContent = describeOpponent();
        el('newGame').hidden = seat === null || game.outcome.status === STATUS.PLAYING;
        el('leave').hidden = seat === null;
        drawReplay();
      }

      /*
       * The reveal, shown in place of the board once there is nothing left to
       * play.
       *
       * Rebuilt only when what it is showing changes. Every heartbeat delivers a
       * fresh snapshot and calls draw(), so rebuilding unconditionally would
       * throw the viewer back to the kick-off once a minute while they were
       * still reading their way through it.
       */
      function drawReplay() {
        if (state.moves.length === 0) inheritedGame = false;
        // A finished game we walked in on is not a reveal; it is somebody
        // else's board that nobody cleared. Say so and offer a fresh one.
        const over = game.outcome.status !== STATUS.PLAYING && !inheritedGame;
        const key = over ? `${room}:${seat}:${state.moves.length}` : null;

        el('playLayout').hidden = over;
        el('replay').hidden = !over;
        // Two boards at full size need more than the site's text measure.
        document.querySelector('.dg-wrap').classList.toggle('dg-wide', over);

        if (key === replayKey) {
          if (over) el('replayStatus').textContent = describeStatus();
          return;
        }
        replayKey = key;

        if (replayView) {
          replayView.destroy();
          replayView = null;
        }
        if (!over) return;

        const note = replayNote(config, seat);
        el('replayTitle').textContent = note.title;
        el('replayBody').textContent = note.body;
        el('replayAfter').textContent = note.after;
        // Carry the room across, so both players land in the same sandbox
        // simply by pressing the button in front of them.
        el('toSandbox').href = room
          ? `SoccerHockeySandboxV4.0.html?room=${encodeURIComponent(room)}`
          : 'SoccerHockeySandboxV4.0.html';
        el('replayStatus').textContent = describeStatus();
        el('replayStatus').dataset.tone = game.outcome.status === STATUS.WON ? 'win' : '';

        // Your own board first, so "on the left" in the note is true for both
        // players even though they hold different seats.
        const order = seat === null ? [0, 1] : [seat, seat === 0 ? 1 : 0];
        const labels = order.map((s, i) =>
          seat === null
            ? `${config.seats[s].name} — ${sportOf(s)}`
            : `${i === 0 ? 'Your board' : "Your opponent's board"} — ${sportOf(s)}`
        );

        /*
         * `ui/replay.js` owns the transport and nothing else — it is shared with
         * Escher Chess, which has no ball to draw. The fold, the renderer and
         * the caption are Soccer Hockey's, and are handed over here.
         */
        const frames = replayFrames(config, state.moves);

        // Built after the section is unhidden: each board measures itself as it
        // is created, and a hidden parent measures as nothing at all.
        replayView = createReplayView(el('replayStage'), {
          moves: state.moves,
          frames,
          seatOrder: order,
          labels,
          createSeatView(mount, s) {
            const view = createBoardView(mount, {
              board: config.board,
              theme: config.seats[s].theme,
              interactive: false,
            });
            return {
              render: (frame) => view.render(viewOf(config, frame, s)),
              destroy: () => view.destroy(),
            };
          },
          describe(index) {
            if (index === 0) {
              return `Before the first move — ${state.moves.length} moves to come`;
            }
            const mover = moverAt(frames, index);
            return (
              `Move ${index} of ${state.moves.length} — played by ` +
              `${config.seats[mover].name}, the ${config.seats[mover].sport ?? 'other'} player`
            );
          },
        });
      }

      function drawRoom() {
        el('roomName').textContent = room ?? '…';
        el('roomTools').hidden = false;

        if (seat === null) {
          el('sportTitle').textContent = 'Soccer Hockey';
          el('sportSub').textContent = 'Both seats taken — you are watching.';
          el('coachBody').textContent =
            'This room is full. Pick another room by name below, or ask your ' +
            'opponent for their invite link.';
          return;
        }

        el('sportTitle').textContent = `${sportOf(seat)} — you are Player ${seat + 1}`;
        el('sportSub').textContent = `Your goal is the gap at the ${cornerOf(seat)}.`;

        const full = occupancy(state.seats, now()).held === 2;
        el('coachBody').textContent = full
          ? 'You are both here. Please stop talking to each other now. Once the ' +
            'first game is over, you can call each other and compare notes.'
          : 'You are the only one here. Send your opponent the invite link, or ' +
            'tell them this room name so they can type it in. Once they arrive, ' +
            'stop talking to each other until the game is over.';
      }

      /* ------------------------------------------------------------ network */

      async function enterRoom(name) {
        if (unwatch) {
          unwatch();
          unwatch = null;
        }
        if (room && seat !== null) await leaveRoom({ name: room, uid });

        room = name;
        const joined = await joinRoom({ name, uid, now: now() });
        seat = joined.seat;
        state = { seats: normaliseSeats(joined.room.seats), moves: joined.room.moves ?? [] };

        // The lens decides the palette, so a change of seat needs a fresh board.
        if (boardView) {
          boardView.destroy();
          boardView = null;
        }

        history.replaceState(null, '', `?room=${encodeURIComponent(name)}`);
        if (seat !== null) rememberRoom(window.localStorage, name);
        // Whether the game was already over when we arrived, before any of our
        // own moves can have changed it.
        inheritedGame =
          joined.seat !== null &&
          !joined.abandoned &&
          replay(config, state.moves).outcome.status !== STATUS.PLAYING;
        drawRoom();
        draw();

        unwatch = await watchRoom(
          name,
          (next) => {
            state = next;
            // A seat can be lost while away; keep ours honest.
            seat = seatOf(next.seats, uid);
            drawRoom();
            draw();
          },
          (err) => {
            el('status').textContent = `Lost contact with the room. ${explain(err)}`;
          }
        );
      }

      function startBeating() {
        const beat = async () => {
          if (!room || seat === null) return;
          try {
            await heartbeat({ name: room, uid, now: now(), active: interacted });
            interacted = false;
          } catch {
            // A missed beat is survivable; the seat holds for five minutes.
          }
        };

        // Faster while it is your move, so the other side can tell you are there.
        let timer = null;
        const schedule = () => {
          clearTimeout(timer);
          const mine = seat !== null && game.turn === seat && game.outcome.status === STATUS.PLAYING;
          timer = setTimeout(async () => {
            await beat();
            schedule();
          }, mine ? ACTIVE_HEARTBEAT_MS : HEARTBEAT_MS);
        };
        schedule();

        for (const evt of ['pointermove', 'keydown', 'pointerdown']) {
          window.addEventListener(evt, () => {
            interacted = true;
          }, { passive: true });
        }

        // Best effort: a closed tab frees its seat at once rather than in five
        // minutes. It does not always fire, which is why the timeout exists.
        window.addEventListener('pagehide', () => {
          if (room && seat !== null) leaveRoom({ name: room, uid });
        });
      }

      /* -------------------------------------------------------------- setup */

      el('copyLink').addEventListener('click', async () => {
        const link = shareLink(location.origin, location.pathname, room);
        try {
          await navigator.clipboard.writeText(link);
          el('copyLink').textContent = 'Link copied';
          setTimeout(() => (el('copyLink').textContent = 'Copy the invite link'), 2000);
        } catch {
          window.prompt('Copy this link:', link);
        }
      });

      el('joinRoom').addEventListener('click', async () => {
        const wanted = el('roomInput').value.trim();
        if (!ROOM_NAMES.includes(wanted)) {
          el('coachBody').textContent = `There is no room called “${wanted}”. Pick one from the list.`;
          return;
        }
        await enterRoom(wanted);
      });

      el('newGame').addEventListener('click', async () => {
        await resetRoom({ name: room });
      });

      el('leave').addEventListener('click', async () => {
        await leaveRoom({ name: room, uid });
        location.href = '/soccer-hockey/';
      });

      el('roomList').append(
        ...ROOM_NAMES.map((name) => {
          const option = document.createElement('option');
          option.value = name;
          return option;
        })
      );

      el('buildStamp').textContent = BUILD;

      (async () => {
        try {
          uid = await signIn();
          const wanted = roomFromLocation(location.search);
          const name = await chooseRoom({
            preferred: wanted,
            remembered: recallRoom(window.localStorage),
            uid,
            now: now(),
          });
          await enterRoom(name);
          startBeating();
        } catch (err) {
          // Name the switch that needs flipping rather than the call that failed.
          el('status').textContent = 'The game could not start.';
          el('coachBody').textContent = explain(err);
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
