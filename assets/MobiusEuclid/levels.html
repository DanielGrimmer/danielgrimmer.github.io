<!DOCTYPE html>
<html lang="en">
<!--
  PARALLAX — Level Viewer (the Mathematica notebook, reborn)

  A port of GameDemos.nb (its source is in GameDemos.decoded.txt beside this
  file): the notebook's full declarative level format, its three scenes
  verbatim in its own units, and its dual renderers — now walkable in real
  time instead of rendered frame by frame.

  The scene compiler takes a list of typed records and draws each once per
  world. The signatures are the notebook's own, from its comment:

      ["F", lev]                              the floor, with its Level text
      ["D", x, y, rho, f, h, color]           cylinder / the band |r - sigma| < rho
      ["L", x0, y0, x1, y1, f, h, color]      wall / the band between the
                                              endpoints' sections
      ["H", x, y, th, s, f, h, color]         bowtie / an arc of that point's
                                              own section
      ["V", r, th, s, f, h, color]            slab / a segment of one fibre
      ["B", x0,y0, x1,y1, th0, s0, f, h, col] clipped band / the L band, cut
                                              off outside the window
      ["E", x, y, f]                          Euclid's spawn
      ["M", r, th, f]                         Mobius's spawn

  Every record carries a floating base f, so platforms can hover — the one
  mechanical feature the notebook had that index.html does not yet.

  D, L and B dualise by MEETING (the Mobius object is the set of lines that
  meet the Euclid region). H and V dualise by CONTAINMENT, because their
  Euclid form is unbounded and ruled and almost every line meets an infinite
  slab — which is why they are solid for Euclid but thin for Mobius. THEORY.md
  section 16 works this out.

  World: win = 3 pi/2, from the notebook.  Euclid's arena is the DISK of
  radius win; the strip shows theta in [pi/2 - win, pi/2 + win] (three tiles)
  with r in [-win, win].  Disk and band match exactly -- the lines meeting a
  disk of radius R are precisely those with |r| <= R -- so neither player can
  stand where the other cannot see him.  A square arena cannot do that, and an
  earlier version of this file used one.

  One deliberate divergence: the notebook Radons the white grid into the
  Mobius floor (the woven background of the old renders).  Here, as in
  floors.html, grids and fibers are chart decorations and are not
  transformed; only the Level text crosses the dictionary, in vector form.
  And the two players keep this repo's identity colours (brown Euclid,
  maroon Mobius) rather than the notebook's both-brown.

  Levels 1-3 are GameDemos.nb's background1..3 verbatim.  Levels 4-8 are ours:
  one per object type, with exactly one of that object in the scene, so each
  type's dual pair can be looked at on its own.

  Controls: Euclid W A S D + Space, Mobius arrows + Enter, R resets, keys 1-8
  or Tab or the chips switch level.

  F (or the button) cycles three VIEW MODES:

      overhead      fixed top-down on each world, as before
      third person  a chase camera behind each player, following his yaw
      first person  down at the players' own eyes

  The two mouse-look modes share everything but the camera rig: the mouse
  claims whichever panel you CLICK ON and takes the pointer lock at the same
  time (Esc releases it, clicking the other panel hands it over, Q swaps
  without releasing), and that player then walks relative to his gaze. The
  other keeps the overhead key mapping and simply turns to face the way he
  walks, so his panel stays sensible.

  window.levels exposes state for tests.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallax — Level Viewer</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden;
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; color:#f5c518; }
  canvas#c { display:block; width:100vw; height:100vh; }
  #hud { position:absolute; inset:0; pointer-events:none; }
  .panel { position:absolute; top:0; bottom:0; display:flex; flex-direction:column;
    justify-content:space-between; padding:56px 18px 14px; box-sizing:border-box; }
  #hudE { left:0; }
  #hudM { right:0; }
  .name { font-size:18px; letter-spacing:.22em; font-weight:700; text-transform:uppercase; }
  .keys { font-size:12px; letter-spacing:.06em; color:#e8dcb0; opacity:.85; margin-top:3px; }
  .cap { font-size:14px; line-height:1.45; color:#f5c518; max-width:34em; min-height:3em; }
  .cap b { color:#fff; font-weight:600; }

  #chips { position:absolute; top:10px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; pointer-events:auto; }

<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="panel" id="hudE">
    <div><div class="name">Euclid</div><div class="keys">W A S D move &nbsp;·&nbsp; Space jump &nbsp;·&nbsp; R reset &nbsp;·&nbsp; 1–8 or Tab: level</div></div>
    <div class="cap" id="capE"></div>
  </div>
  <div id="divider"></div>
  <div class="panel" id="hudM">
    <div style="text-align:right"><div class="name">Möbius</div><div class="keys">Arrows move &nbsp;·&nbsp; Enter jump</div></div>
    <div class="cap" id="capM" style="text-align:right;align-self:flex-end"></div>
  </div>
  <div class="crosshair" id="xhE"></div>
  <div class="crosshair" id="xhM"></div>

    <span id="mouseTag"></span>
  </div>
</div>
<div id="err">three.js failed to load — check the network connection.</div>

<script src="three.r128.min.js"></script>
<script>if (typeof THREE === 'undefined') document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>
if (typeof THREE === 'undefined') { document.getElementById('err').style.display = 'grid'; }
else (function () {
'use strict';
const PI = Math.PI, TAU = 2 * Math.PI;

// ------------------------------------------------ the notebook's world, verbatim
// The arena is a DISK, and its radius is the strip's r half-range. That makes
// the two worlds match exactly: the lines meeting a disk of radius RA are
// PRECISELY those with |r| <= RA, so neither player can stand anywhere the
// other cannot see him. A square cannot do this -- a line whose |r| falls
// between the square's inradius and its circumradius misses the square
// altogether, which let Mobius walk clean off Euclid's field. (THEORY.md 6.)
const RA   = 3 * PI / 2;                  // the notebook's win, as a radius
const RMAX = RA;                          // the strip's r half-range; also its theta half-range
const TH_MIN = PI / 2 - RMAX, TH_MAX = PI / 2 + RMAX;   // three tiles: [-pi, 2pi]
const MSTEP = 0.5;                        // the floor grid's mesh step
const S = 1.5, XM0 = 500;                 // strip drawing scale; the strip lives far away
const NSEG = 480;
const PR = 0.25, PH = 1.0, W = 0.14;      // notebook player: rho = 1/4, h = 1
const G = 30, JUMP_V = 8, SPEED = 3.5, STEP = 0.2;

// yaw/pitch are the first-person look angles; yaw = 0 faces +v (into the screen
// in the overhead view), and drives movement when first person is on.
const euclid = { u: 0, v: 0, z: 0, vz: 0, grounded: true, yaw: 0, pitch: -0.12 };
const mobius = { u: 0, v: 0, z: 0, vz: 0, grounded: true, yaw: 0, pitch: -0.12 };   // u = theta * S

const EYE = 0.78;                  // eye height inside the PH = 1 body
const CHASE_DIST = 4.6, CHASE_AIM = 0.95, CHASE_LIFT = 0.95;   // behind, aimed at, and raised
const VIEWS = ['overhead', 'chase', 'first'];
const VIEW_NAME = { overhead: 'Overhead', chase: 'Third person', first: 'First person' };
let view = 'overhead';
let mouseOn = 'E';                 // which player the mouse is steering
const looking = () => view !== 'overhead';   // mouse-look and gaze-relative movement

const sigma = (a, b, th) => a * Math.cos(th) + b * Math.sin(th);
const parity = k => (((k % 2) + 2) % 2 === 0) ? 1 : -1;
const distToSeg = (px, py, ax, ay, bx, by) => {
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1e-9;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L2));
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
};

// ------------------------------------------------------------ scene scaffolding
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setScissorTest(true);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
scene.add(new THREE.AmbientLight(0xffffff, 0.42));
const sun = new THREE.DirectionalLight(0xffffff, 0.62); sun.position.set(20, 45, 30); scene.add(sun);
const sun2 = new THREE.DirectionalLight(0xffffff, 0.62); sun2.position.set(XM0 + 20, 45, 30); sun2.target.position.set(XM0, 0, 0); scene.add(sun2); scene.add(sun2.target);
const camE = new THREE.PerspectiveCamera(42, 1, 0.06, 200);
const camM = new THREE.PerspectiveCamera(42, 1, 0.06, 200);

const lambert = (color, extra) => new THREE.MeshLambertMaterial(Object.assign({ color, side: THREE.DoubleSide }, extra || {}));
const lineMat = (color, opacity) => new THREE.LineBasicMaterial({ color, transparent: true, opacity });
const segsGeo = pts => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); return g; };
const E2W = (a, b, y) => new THREE.Vector3(a, y, -b);
const M2W = (th, r, y) => new THREE.Vector3(XM0 + th * S, y, -r);

// Charts (not transformed): the square grid at mstep = 1/2, the strip's fibers.
{
  // A ground surface under each world. From above it barely registers; at eye
  // level it is the difference between standing somewhere and floating in the
  // dark, since the grid alone vanishes at grazing angles.
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x101018, side: THREE.DoubleSide });
  const eGround = new THREE.Mesh(new THREE.CircleGeometry(RA, 64), groundMat);
  eGround.rotation.x = -PI / 2; eGround.position.y = -0.02; scene.add(eGround);
  const mGround = new THREE.Mesh(new THREE.PlaneGeometry((TH_MAX - TH_MIN) * S, 2 * RMAX), groundMat);
  mGround.rotation.x = -PI / 2;
  mGround.position.set(XM0 + (TH_MIN + TH_MAX) / 2 * S, -0.02, 0); scene.add(mGround);

  const pts = [];
  for (let k = -Math.floor(RA / MSTEP); k <= Math.floor(RA / MSTEP); k++) {
    const c = k * MSTEP, half = Math.sqrt(Math.max(0, RA * RA - c * c));
    if (half < 1e-6) continue;
    pts.push(c, 0, -half, c, 0, half, -half, 0, -c, half, 0, -c);
  }
  scene.add(new THREE.LineSegments(segsGeo(pts), lineMat(0xdedede, 0.4)));
  const rim = [];
  for (let i = 0; i <= 192; i++) { const t = i / 192 * TAU; rim.push(RA * Math.cos(t), 0, -RA * Math.sin(t)); }
  scene.add(new THREE.Line(segsGeo(rim), lineMat(0xdedede, 0.9)));
  const dashed = new THREE.LineDashedMaterial({ color: 0x9a9a9a, dashSize: 0.3, gapSize: 0.24, transparent: true, opacity: 0.7 });
  for (let th = Math.ceil(TH_MIN / (PI / 6)) * PI / 6; th <= TH_MAX + 1e-9; th += PI / 6) {
    const l = new THREE.Line(segsGeo([XM0 + th * S, 0, -RMAX, XM0 + th * S, 0, RMAX]), dashed); l.computeLineDistances(); scene.add(l);
  }
  scene.add(new THREE.LineSegments(segsGeo([XM0 + TH_MIN * S, 0, -RMAX, XM0 + TH_MAX * S, 0, -RMAX, XM0 + TH_MIN * S, 0, RMAX, XM0 + TH_MAX * S, 0, RMAX]), lineMat(0xdedede, 0.9)));
}

// The band mesh, as in the game: a wall on the strip between two theta->r curves.
class Band {
  constructor(material) {
    this.geo = new THREE.BufferGeometry();
    this.pos = new Float32Array(NSEG * 4 * 18 + 2 * 18);   // 4 quads a segment, plus two end caps
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    this.mesh = new THREE.Mesh(this.geo, material);
    this.mesh.frustumCulled = false;
  }
  set(lo, hi, base, h) {
    const p = this.pos; let j = 0;
    const put = (x, y, z) => { p[j++] = x; p[j++] = y; p[j++] = z; };
    const quad = (A, B, C, D) => { put(...A); put(...B); put(...C); put(...A); put(...C); put(...D); };
    const yb = base, yt = base + h;
    for (let i = 0; i < NSEG; i++) {
      const t0 = TH_MIN + (TH_MAX - TH_MIN) * i / NSEG, t1 = TH_MIN + (TH_MAX - TH_MIN) * (i + 1) / NSEG;
      const x0 = XM0 + t0 * S, x1 = XM0 + t1 * S;
      const l0 = -lo(t0), l1 = -lo(t1), h0 = -hi(t0), h1 = -hi(t1);
      quad([x0, yt, l0], [x1, yt, l1], [x1, yt, h1], [x0, yt, h0]);   // top
      quad([x0, yb, l0], [x1, yb, l1], [x1, yb, h1], [x0, yb, h0]);   // bottom
      quad([x0, yb, l0], [x1, yb, l1], [x1, yt, l1], [x0, yt, l0]);   // wall along lo
      quad([x0, yb, h0], [x1, yb, h1], [x1, yt, h1], [x0, yt, h0]);   // wall along hi
    }
    for (const t of [TH_MIN, TH_MAX]) {                               // end caps
      const x = XM0 + t * S, l = -lo(t), hh = -hi(t);
      quad([x, yb, l], [x, yb, hh], [x, yt, hh], [x, yt, l]);
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.computeVertexNormals();
  }
}

// ---------- Level text, in both worlds (vector form of the notebook's floors)
function makeText(str, flip) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const ctx = cv.getContext('2d');
  if (flip) { ctx.translate(0, 128); ctx.scale(1, -1); }
  ctx.font = 'bold 84px "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f5c518'; ctx.fillText(str, 256, 66);
  const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter;
  return tex;
}
function textPoints(str, n) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const ctx = cv.getContext('2d');
  ctx.font = 'bold 84px "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(str, 256, 66);
  const d = ctx.getImageData(0, 0, 512, 128).data, pts = [];
  for (let y = 0; y < 128; y += 2) for (let x = 0; x < 512; x += 2) if (d[(y * 512 + x) * 4 + 3] > 128) pts.push([x / 512, y / 128]);
  const out = [], stride = Math.max(1, pts.length / n);
  for (let i = 0; i < pts.length; i += stride) out.push(pts[Math.floor(i)]);
  return out;
}
const decalMat = tex => new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
function decal(tex, w, pos) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 4), decalMat(tex));
  m.rotation.x = -PI / 2; m.position.copy(pos); return m;
}

/**
 * The floor pair for one level, all in one group:
 * Euclid: "Level n" decal high on the disk, plus the line fan of the strip
 * text's points (the notebook's InverseRadon layer, in vector form).
 * Mobius: one decal per tile at r = -/+ 0.7 RA, flipped on odd tiles (the
 * notebook's levMob), plus the sinusoid bundle of the Euclid text's points
 * (the notebook's Radon layer, in vector form).
 */
function buildFloor(levName) {
  const group = new THREE.Group();
  const YEL = 0xf5c518;
  group.add(decal(makeText(levName, false), 0.8 * RA, E2W(0, 0.78 * RA, 0.02)));
  const texN = makeText(levName, false), texF = makeText(levName, true);
  // Tiles at theta = -pi/2, pi/2, 3pi/2; notebook flips the outer two and
  // alternates the sign of r.
  for (const [k, tile] of [[-1, -PI / 2], [0, PI / 2], [1, 3 * PI / 2]]) {
    const s = parity(k);
    group.add(decal(s > 0 ? texN : texF, 2.6 * S, M2W(tile, s * -0.7 * RA, 0.02)));
  }
  // Euclid's text, on the strip: a bundle of sections.
  {
    const tx = [];
    for (const [px, py] of textPoints(levName, 30)) {
      const a = (px - 0.5) * 0.8 * RA, b = 0.78 * RA + (0.5 - py) * 0.2 * RA;
      let prev = null;
      for (let i = 0; i <= 240; i++) {
        const th = TH_MIN + (TH_MAX - TH_MIN) * i / 240, p = [XM0 + th * S, 0.03, -sigma(a, b, th)];
        if (prev) tx.push(...prev, ...p); prev = p;
      }
    }
    group.add(new THREE.LineSegments(segsGeo(tx), lineMat(YEL, 0.18)));
  }
  // The canonical tile's text, on the plane: a fan of lines.
  {
    const tx = [];
    for (const [px, py] of textPoints(levName, 30)) {
      const th = PI / 2 + (px - 0.5) * 2.6, r = -0.7 * RA + (0.5 - py) * 0.24 * RA;
      const half = Math.sqrt(Math.max(0, RA * RA - r * r));      // stop at the rim
      if (half < 1e-6) continue;
      const fx = r * Math.cos(th), fy = r * Math.sin(th), dx = -Math.sin(th), dy = Math.cos(th);
      tx.push(fx - half * dx, 0.03, -(fy - half * dy), fx + half * dx, 0.03, -(fy + half * dy));
    }
    group.add(new THREE.LineSegments(segsGeo(tx), lineMat(YEL, 0.28)));
  }
  return group;
}

// ------------------------------------------------ the notebook's object types
// The full declarative format from GameDemos.nb (its own comment, verbatim):
//
//     F: level;
//     D: x, y, rho, f, h, color;
//     L: x0, y0, x1, y1, f, h, color;
//     H: x, y, theta, s, f, h, color;
//     V: r, theta, s, f, h, color;
//     B: x0, y0, x1, y1, theta0, s0, f, h, color;
//     E: x, y, f;
//     M: r, theta, f;
//
// Each maker returns { group, solidE, solidM } — the meshes for both worlds and
// the collision entry for each. Every record has a floating base f.
//
// D, L and B dualise by MEETING: the Mobius object is the set of lines that
// meet the Euclid region, which is a band. H and V dualise by CONTAINMENT —
// the set of lines lying INSIDE the region — because their Euclid form is
// unbounded and ruled, and almost every line meets an infinite slab. That is
// why they are solid for Euclid but thin for Mobius. See THEORY.md 16.

const LFAR = 2.4 * RA;                 // long enough to cross the disk from anywhere inside

/** Sutherland–Hodgman clip to the arena, approximating the disk by the
    half-planes of a circumscribed polygon. The notebook let PlotRange do this;
    nothing clips here, so unbounded footprints would run off the floor. */
const ARENA_SIDES = 64;
function clipToArena(poly) {
  let out = poly;
  for (let i = 0; i < ARENA_SIDES; i++) {
    const a = (i / ARENA_SIDES) * TAU, nx = Math.cos(a), ny = Math.sin(a);
    const f = p => RA - (p[0] * nx + p[1] * ny);
    const inp = out; out = [];
    for (let i = 0; i < inp.length; i++) {
      const A = inp[i], B = inp[(i + 1) % inp.length], fa = f(A), fb = f(B);
      if (fa >= 0) out.push(A);
      if ((fa >= 0) !== (fb >= 0)) {
        const t = fa / (fa - fb);
        out.push([A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])]);
      }
    }
    if (!out.length) return [];
  }
  return out;
}

/** A footprint polygon extruded to height h, floating at f0. */
function prism(verts, f0, h, material) {
  if (verts.length < 3) return null;
  const shape = new THREE.Shape(verts.map(([x, y]) => new THREE.Vector2(x, y)));
  const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false }), material);
  mesh.rotation.x = -PI / 2;          // local (x, y, depth) -> world (x, depth, -y)
  mesh.position.y = f0;
  return mesh;
}

/** One half of a bowtie: the sector at (px, py) spanning the line directions
    d(a) = (-sin a, cos a) for a in the window, out to LFAR. */
function sectorFootprint(px, py, th0, s, sign) {
  const pts = [[px, py]];
  for (let i = 0; i <= 8; i++) {
    const a = th0 - s / 2 + s * i / 8;
    pts.push([px + sign * -Math.sin(a) * LFAR, py + sign * Math.cos(a) * LFAR]);
  }
  return pts;
}

/** The slab between the parallel lines (th0, r0) and (th0, r1). */
function slabFootprint(th0, r0, r1) {
  const nx = Math.cos(th0), ny = Math.sin(th0), dx = -ny, dy = nx;
  return [
    [r0 * nx - LFAR * dx, r0 * ny - LFAR * dy], [r0 * nx + LFAR * dx, r0 * ny + LFAR * dy],
    [r1 * nx + LFAR * dx, r1 * ny + LFAR * dy], [r1 * nx - LFAR * dx, r1 * ny - LFAR * dy],
  ];
}

/** Signed distance into the repeating window th0 +/- s/2 (mod pi); <= 0 inside. */
const winDist = (th, th0, s) => {
  let d = th - th0;
  d -= PI * Math.round(d / PI);
  return Math.abs(d) - s / 2;
};

/** Distance from (u, v) to the bowtie at (px, py). */
function bowtieDist(px, py, th0, s, u, v) {
  const dx = u - px, dy = v - py, rho = Math.hypot(dx, dy);
  if (rho < 1e-9) return 0;
  const ex = winDist(Math.atan2(dy, dx) - PI / 2, th0, s);   // d(a) points at angle a + pi/2
  if (ex <= 0) return 0;
  return ex >= PI / 2 ? rho : rho * Math.sin(ex);
}

/** Like Band, but drawn only where theta falls inside a repeating window.
    Built per tile, so no degenerate triangles reach computeVertexNormals. */
function windowedBand(lo, hi, th0, s, f0, h, material) {
  const pos = [];
  const put = (x, y, z) => pos.push(x, y, z);
  const quad = (A, B, C, D) => { put(...A); put(...B); put(...C); put(...A); put(...C); put(...D); };
  const N = 40, yb = f0, yt = f0 + h;
  for (let k = Math.ceil((TH_MIN - th0) / PI); k <= Math.floor((TH_MAX - th0) / PI); k++) {
    const a = Math.max(TH_MIN, th0 + k * PI - s / 2), b = Math.min(TH_MAX, th0 + k * PI + s / 2);
    if (b <= a) continue;
    for (let i = 0; i < N; i++) {
      const t0 = a + (b - a) * i / N, t1 = a + (b - a) * (i + 1) / N;
      const x0 = XM0 + t0 * S, x1 = XM0 + t1 * S;
      const l0 = -lo(t0), l1 = -lo(t1), h0 = -hi(t0), h1 = -hi(t1);
      quad([x0, yt, l0], [x1, yt, l1], [x1, yt, h1], [x0, yt, h0]);   // top
      quad([x0, yb, l0], [x1, yb, l1], [x1, yb, h1], [x0, yb, h0]);   // bottom
      quad([x0, yb, l0], [x1, yb, l1], [x1, yt, l1], [x0, yt, l0]);   // wall along lo
      quad([x0, yb, h0], [x1, yb, h1], [x1, yt, h1], [x0, yt, h0]);   // wall along hi
    }
    // Caps at the window's two edges. Without these the band is an open tube
    // and you can see straight into it -- which is what B looked like.
    for (const t of [a, b]) {
      const x = XM0 + t * S, l = -lo(t), hh = -hi(t);
      quad([x, yb, l], [x, yb, hh], [x, yt, hh], [x, yt, l]);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, material);
  mesh.frustumCulled = false;
  return mesh;
}

/** "D": a cylinder for Euclid; the band |r - sigma| < rho for Mobius. */
function makeD([x0, y0, rho, f0, h0, color]) {
  const group = new THREE.Group();
  const mat = lambert(color);
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(rho, rho, h0, 40), mat);
  cyl.position.copy(E2W(x0, y0, f0 + h0 / 2)); group.add(cyl);
  const band = { lo: th => sigma(x0, y0, th) - rho, hi: th => sigma(x0, y0, th) + rho };
  const b = new Band(mat); b.set(band.lo, band.hi, f0, h0); group.add(b.mesh);
  return {
    group,
    solidE: { overlap: (u, v, rad) => Math.hypot(u - x0, v - y0) < rho + rad, base: () => f0, top: () => f0 + h0 },
    solidM: { overlap: (u, v, rad) => bandOverlap(band, u, v, rad), base: () => f0, top: () => f0 + h0 },
  };
}

/**
 * "L": a wall from (x0, y0) to (x1, y1) — for Euclid a thin wall; for Mobius
 * the region between the two endpoint sections, since a point t along the
 * segment has section sigma0 + t (sigma1 - sigma0), linear in t.
 */
function makeL([x0, y0, x1, y1, f0, h0, color]) {
  const group = new THREE.Group();
  const mat = lambert(color);
  const len = Math.hypot(x1 - x0, y1 - y0);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(len, h0), mat);
  wall.position.copy(E2W((x0 + x1) / 2, (y0 + y1) / 2, f0 + h0 / 2));
  wall.rotation.y = Math.atan2(y1 - y0, x1 - x0); group.add(wall);
  const band = {
    lo: th => Math.min(sigma(x0, y0, th), sigma(x1, y1, th)),
    hi: th => Math.max(sigma(x0, y0, th), sigma(x1, y1, th)),
  };
  const b = new Band(mat); b.set(band.lo, band.hi, f0, h0); group.add(b.mesh);
  return {
    group,
    solidE: { overlap: (u, v, rad) => distToSeg(u, v, x0, y0, x1, y1) < rad + 0.02, base: () => f0, top: () => f0 + h0 },
    solidM: { overlap: (u, v, rad) => bandOverlap(band, u, v, rad), base: () => f0, top: () => f0 + h0 },
  };
}

/**
 * "H": every line through (x0, y0) whose normal angle lies in the window —
 * a bowtie for Euclid (the notebook draws polyH at theta and at theta + pi),
 * and for Mobius an arc of that point's own section. Thin, because a bundle
 * of lines through a point is one-dimensional in his world.
 */
function makeH([x0, y0, th0, s0, f0, h0, color]) {
  const group = new THREE.Group();
  const mat = lambert(color);
  for (const sign of [1, -1]) {
    const m = prism(clipToArena(sectorFootprint(x0, y0, th0, s0, sign)), f0, h0, mat);
    if (m) group.add(m);
  }
  const T = 0.09;
  const sig = th => sigma(x0, y0, th);
  // sigma is pi-antiperiodic, so one curve already serves every tile correctly.
  group.add(windowedBand(th => sig(th) - T, th => sig(th) + T, th0, s0, f0, h0, mat));
  return {
    group,
    solidE: { overlap: (u, v, rad) => bowtieDist(x0, y0, th0, s0, u, v) < rad, base: () => f0, top: () => f0 + h0 },
    solidM: {
      overlap: (u, v, rad) => {
        const th = u / S;
        return winDist(th, th0, s0) <= rad / S && Math.abs(v - sig(th)) < T + rad;
      },
      base: () => f0, top: () => f0 + h0,
    },
  };
}

/**
 * "V": the lines lying between the parallels (th0, r0) and (th0, r0 + s0) —
 * an infinite slab for Euclid, and for Mobius a segment of a single FIBRE,
 * repeated once per tile with the half-turn flip.
 */
function makeV([r0, th0, s0, f0, h0, color]) {
  const group = new THREE.Group();
  const mat = lambert(color);
  const r1 = r0 + s0, lo = Math.min(r0, r1), hi = Math.max(r0, r1);
  const m = prism(clipToArena(slabFootprint(th0, lo, hi)), f0, h0, mat);
  if (m) group.add(m);
  const TV = 0.06;                                        // half-width in theta
  const geo = new THREE.BoxGeometry(2 * TV * S, h0, hi - lo);
  for (let k = Math.ceil((TH_MIN - th0) / PI); k <= Math.floor((TH_MAX - th0) / PI); k++) {
    const seg = new THREE.Mesh(geo, mat);
    seg.position.copy(M2W(th0 + k * PI, parity(k) * (lo + hi) / 2, f0 + h0 / 2));
    group.add(seg);
  }
  return {
    group,
    solidE: {
      overlap: (u, v, rad) => { const s = sigma(u, v, th0); return s > lo - rad && s < hi + rad; },
      base: () => f0, top: () => f0 + h0,
    },
    solidM: {
      overlap: (u, v, rad) => {
        const th = u / S;
        if (winDist(th, th0, 2 * TV) > rad / S) return false;
        const sgn = parity(Math.round((th - th0) / PI));
        return v > Math.min(sgn * lo, sgn * hi) - rad && v < Math.max(sgn * lo, sgn * hi) + rad;
      },
      base: () => f0, top: () => f0 + h0,
    },
  };
}

/**
 * "B": every line separating (x0, y0) from (x1, y1) whose normal angle lies in
 * the window — for Mobius the L band clipped to that window. Euclid's side is
 * drawn as the notebook draws it: a bowtie at each endpoint plus the slab
 * between their projections on n(th0). That is a slight over-draw of the true
 * union (whose middle piece is the intersection of the slabs across the
 * window, not the slab at th0); collision matches what is drawn.
 */
function makeB([x0, y0, x1, y1, th0, s0, f0, h0, color]) {
  const group = new THREE.Group();
  const mat = lambert(color);
  const ends = [[x0, y0], [x1, y1]];
  for (const [px, py] of ends) for (const sign of [1, -1]) {
    const m = prism(clipToArena(sectorFootprint(px, py, th0, s0, sign)), f0, h0, mat);
    if (m) group.add(m);
  }
  const sa = sigma(x0, y0, th0), sb = sigma(x1, y1, th0);
  const slab = prism(clipToArena(slabFootprint(th0, Math.min(sa, sb), Math.max(sa, sb))), f0, h0, mat);
  if (slab) group.add(slab);
  const lo = th => Math.min(sigma(x0, y0, th), sigma(x1, y1, th));
  const hi = th => Math.max(sigma(x0, y0, th), sigma(x1, y1, th));
  group.add(windowedBand(lo, hi, th0, s0, f0, h0, mat));
  return {
    group,
    solidE: {
      overlap: (u, v, rad) => {
        if (ends.some(([px, py]) => bowtieDist(px, py, th0, s0, u, v) < rad)) return true;
        const s = sigma(u, v, th0);
        return s > Math.min(sa, sb) - rad && s < Math.max(sa, sb) + rad;
      },
      base: () => f0, top: () => f0 + h0,
    },
    solidM: {
      overlap: (u, v, rad) => {
        for (const du of [-rad, 0, rad]) {
          const th = (u + du) / S;
          if (winDist(th, th0, s0) > 0) continue;
          if (v > lo(th) - rad && v < hi(th) + rad) return true;
        }
        return false;
      },
      base: () => f0, top: () => f0 + h0,
    },
  };
}

const MAKERS = { D: makeD, L: makeL, H: makeH, V: makeV, B: makeB };

const bandOverlap = (band, u, v, rad) => {
  for (const du of [-rad, 0, rad]) {
    const th = (u + du) / S;
    if (v > band.lo(th) - rad && v < band.hi(th) + rad) return true;
  }
  return false;
};

const playerGeo = new THREE.CylinderGeometry(PR, PR, PH, 28);
const shadowGeo = new THREE.CircleGeometry(PR * 1.05, 24), shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.55, depthWrite: false });
const mkPlayer = mats => { const m = new THREE.Mesh(playerGeo, mats); const sh = new THREE.Mesh(shadowGeo, shadowMat); sh.rotation.x = -PI / 2; return { m, sh }; };

// ------------------------------------------------------------ level switching
let solidsE = [], solidsM = [];
let current = null, currentIndex = 0;
const inArenaE = (u, v, rad) => Math.hypot(u, v) < RA - rad;   // the disk, matching |r| <= RA
const inArenaM = (u, v, rad) => Math.abs(v) < RMAX - rad;

/** The notebook's scene compiler: walk the record list and dispatch on the
    type letter, exactly as drawEuc/drawMob do — but building both worlds and
    both collision sets in one pass. F picks the floor; E and M set the spawns
    (the notebook animates them instead). */
const levelName = spec => spec.name ?? ('Level ' + (spec.back.find(r => r[0] === 'F')?.[1] ?? 1));

function loadLevel(i) {
  currentIndex = i;
  const spec = LEVELS[i], name = levelName(spec);
  if (current) { scene.remove(current); current.traverse(o => { o.geometry?.dispose?.(); }); }
  current = new THREE.Group();
  solidsE = []; solidsM = [];
  let eHome = [0, 0, 0], mHome = [0, PI / 2, 0];
  for (const [type, ...args] of spec.back) {
    if (type === 'F') { current.add(buildFloor(name)); continue; }   // args[0] is the notebook's level number
    if (type === 'E') { eHome = args; continue; }            // x, y, f
    if (type === 'M') { mHome = args; continue; }            // r, theta, f
    const made = MAKERS[type](args);
    current.add(made.group);
    solidsE.push(made.solidE); solidsM.push(made.solidM);
  }
  // Each player is a solid of the other's world, at whatever height he holds.
  solidsE.push({ overlap: (u, v, rad) => Math.abs(sigma(u, v, mobius.u / S) - mobius.v) < W + rad,
    base: () => mobius.z, top: () => mobius.z + PH });
  solidsM.push({ overlap: (u, v, rad) => bandOverlap({ lo: th => sigma(euclid.u, euclid.v, th) - W, hi: th => sigma(euclid.u, euclid.v, th) + W }, u, v, rad),
    base: () => euclid.z, top: () => euclid.z + PH });
  scene.add(current);
  Object.assign(euclid, { u: eHome[0], v: eHome[1], z: eHome[2] || 0, vz: 0, grounded: true });
  Object.assign(mobius, { u: mHome[1] * S, v: mHome[0], z: mHome[2] || 0, vz: 0, grounded: true });
  for (const b of chips.children) b.classList.toggle('on', +b.dataset.i === i);
  document.getElementById('capE').innerHTML = `<b>${name}</b> — ${spec.capE}`;
  document.getElementById('capM').innerHTML = `<b>${name}</b> — ${spec.capM}`;
}

// ------------------------------------------------------------ physics
function stepPlayer(P, solids, inArena, ctl, dt) {
  const blocked = (u, v) => !inArena(u, v, PR) ||
    solids.some(s => s.overlap(u, v, PR) && s.top() > P.z + STEP && s.base() < P.z + PH);
  // Movement is relative to where you are looking. yaw = 0 gives the old
  // behaviour exactly (strafe -> u, forward -> v), so the overhead view is
  // unchanged; in first person W walks along the look direction.
  let fwd = ctl.up - ctl.down, str = ctl.right - ctl.left;
  const n = Math.hypot(fwd, str); if (n > 1) { fwd /= n; str /= n; }
  const yaw = ctl.yaw || 0, c = Math.cos(yaw), s = Math.sin(yaw);
  let du = (str * c - fwd * s) * SPEED * dt, dv = (str * s + fwd * c) * SPEED * dt;
  if (du && !blocked(P.u + du, P.v)) P.u += du;
  if (dv && !blocked(P.u, P.v + dv)) P.v += dv;
  if (ctl.jump && P.grounded) { P.vz = JUMP_V; P.grounded = false; }
  P.vz -= G * dt;
  let support = 0;
  for (const s of solids) {
    if (s.overlap(P.u, P.v, PR * 0.8) && s.top() <= P.z + STEP && s.base() < P.z + PH) {
      support = Math.max(support, s.top());
    }
  }
  const zn = P.z + P.vz * dt;
  if (P.vz <= 0 && zn <= support) { P.z = support; P.vz = 0; P.grounded = true; }
  else { P.z = zn; P.grounded = false; }
}

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR') loadLevel(currentIndex);
  if (e.code === 'Tab') { e.preventDefault(); loadLevel((currentIndex + 1) % LEVELS.length); }
  if (e.code === 'KeyF') cycleView();
  if (e.code === 'KeyQ' && looking()) { mouseOn = mouseOn === 'E' ? 'M' : 'E'; paintView(); }
  const d = /^Digit([1-8])$/.exec(e.code);          // 1-3 the notebook's scenes, 4-8 one per type
  if (d && +d[1] <= LEVELS.length) loadLevel(+d[1] - 1);
});
addEventListener('keyup', e => { keys[e.code] = false; });
// Only the mouse-steered player walks relative to his gaze; the other keeps the
// overhead mapping (W = +v) so his keys stay predictable while he is not aimed.
const ctlE = () => ({ left: keys.KeyA ? 1 : 0, right: keys.KeyD ? 1 : 0, up: keys.KeyW ? 1 : 0, down: keys.KeyS ? 1 : 0, jump: !!keys.Space, yaw: (looking() && mouseOn === 'E') ? euclid.yaw : 0 });
const ctlM = () => ({ left: keys.ArrowLeft ? 1 : 0, right: keys.ArrowRight ? 1 : 0, up: keys.ArrowUp ? 1 : 0, down: keys.ArrowDown ? 1 : 0, jump: !!keys.Enter, yaw: (looking() && mouseOn === 'M') ? mobius.yaw : 0 });

/** Turn a player to face the way he is walking (for whoever the mouse is not
    steering). Camera forward in (u, v) is (-sin yaw, cos yaw). */
function faceMotion(P, ctl, dt) {
  const fwd = ctl.up - ctl.down, str = ctl.right - ctl.left;
  if (!fwd && !str) return;
  let d = Math.atan2(-str, fwd) - P.yaw;
  d -= TAU * Math.round(d / TAU);
  P.yaw += d * Math.min(1, 8 * dt);
}

/** Put a camera at a player's eye, looking along his yaw/pitch. */
function placeEye(cam, pos, P) {
  cam.position.copy(pos);
  cam.rotation.order = 'YXZ';
  cam.rotation.set(P.pitch, P.yaw, 0);
}

/** The look direction for a yaw/pitch pair, in world space. */
const gaze = (yaw, pitch) => new THREE.Vector3(
  -Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));

/** Put a camera behind and above a player, looking over him: the third-person
    chase rig. Pitch orbits it up and down; it is clamped, and then floored, so
    that looking up never buries the camera in the ground. */
function placeChase(cam, target, P) {
  const pitch = Math.max(-1.2, Math.min(0.75, P.pitch));
  cam.position.copy(target).addScaledVector(gaze(P.yaw, pitch), -CHASE_DIST);
  cam.position.y = Math.max(cam.position.y + CHASE_LIFT, 0.45);   // shoulder height, so the floor ahead shows
  cam.lookAt(target);
}

function paintView() {
  fpBtn.classList.toggle('on', looking());
  fpBtn.textContent = VIEW_NAME[view];
  const who = mouseOn === 'E' ? 'Euclid' : 'Möbius';
  mouseTag.textContent = looking()
    ? (document.pointerLockElement === canvas
        ? `steering ${who} — Esc, then click the other panel (Q swaps)`
        : 'click a panel to steer that player')
    : '';
  // The crosshair belongs to first person; in third person it would sit on the
  // back of your own head. The aimed panel is named in the tag and lit here.
  xh.E.style.display = view === 'first' ? 'block' : 'none';
  xh.M.style.display = view === 'first' ? 'block' : 'none';
  xh.E.style.opacity = mouseOn === 'E' ? '1' : '.35';
  xh.M.style.opacity = mouseOn === 'M' ? '1' : '.35';
  hudE.classList.toggle('aimed', looking() && mouseOn === 'E');
  hudM.classList.toggle('aimed', looking() && mouseOn === 'M');
  // Only in FIRST person must a player not see his own body, from the inside.
  // Third person is the view where you want to see it. His image in the OTHER
  // world (tube / bar) is a different mesh and stays either way.
  const hide = view === 'first';
  eMesh.m.visible = eMesh.sh.visible = !hide;
  mMeshes[3].m.visible = mMeshes[3].sh.visible = !hide;   // k = 0 is his home copy
}
function setView(next) {
  view = VIEWS.includes(next) ? next : 'overhead';
  if (!looking() && document.pointerLockElement === canvas) document.exitPointerLock();
  paintView();
}
const cycleView = () => setView(VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length]);
fpBtn.addEventListener('click', cycleView);

// The mouse claims whichever panel you click on. Pointer lock hides the cursor,
// so a click can only name a panel while the lock is off — hence Esc first, and
// Q as the in-play shortcut.
canvas.addEventListener('click', e => {
  if (!looking() || document.pointerLockElement === canvas) return;
  mouseOn = e.clientX < splitX ? 'E' : 'M';
  paintView();
  canvas.requestPointerLock();
});
document.addEventListener('pointerlockchange', paintView);
addEventListener('mousemove', e => {
  if (!looking() || document.pointerLockElement !== canvas) return;
  const P = mouseOn === 'E' ? euclid : mobius;
  P.yaw -= e.movementX * SENS;
  P.pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, P.pitch - e.movementY * SENS));
});

// ------------------------------------------------------------ frame
window.levels = {
  euclid, mobius, sigma, S, LEVELS, loadLevel,
  get solidsE() { return solidsE; }, get solidsM() { return solidsM; },
  step: (who, ctl, dt) => who === 'E' ? stepPlayer(euclid, solidsE, inArenaE, ctl, dt) : stepPlayer(mobius, solidsM, inArenaM, ctl, dt),
  scene, camE, camM,
  get view() { return view; }, setView, cycleView,
  get firstPerson() { return view === 'first'; },
  get mouseOn() { return mouseOn; },
  setMouseOn: w => { mouseOn = w; paintView(); },
  look: (who, yaw, pitch) => { const P = who === 'E' ? euclid : mobius; P.yaw = yaw; P.pitch = pitch; },
  ctlE, ctlM,
};
loadLevel(0);
paintView();
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  const cE = ctlE(), cM = ctlM();
  stepPlayer(euclid, solidsE, inArenaE, cE, dt);
  stepPlayer(mobius, solidsM, inArenaM, cM, dt);
  if (looking()) {
    if (mouseOn !== 'E') faceMotion(euclid, cE, dt);
    if (mouseOn !== 'M') faceMotion(mobius, cM, dt);
  }
  if (mobius.u / S >= TAU) mobius.u -= TAU * S;   // theta + 2pi is the same point
  if (mobius.u / S < 0) mobius.u += TAU * S;      // keep him within [0, 2pi) x 3 tiles

  const th = mobius.u / S, r = mobius.v;
  eMesh.m.position.copy(E2W(euclid.u, euclid.v, euclid.z + PH / 2)); eMesh.sh.position.copy(E2W(euclid.u, euclid.v, 0.015));
  const chord = 2 * Math.sqrt(Math.max(0, RA * RA - r * r));
  bar.visible = chord > 1e-3; bar.scale.x = Math.max(chord, 1e-3);
  bar.position.copy(E2W(r * Math.cos(th), r * Math.sin(th), mobius.z + PH / 2)); bar.rotation.y = th + PI / 2;
  mMeshes.forEach((pm, i) => {
    const k = i - 3, tk = th + k * PI, vis = tk > TH_MIN && tk < TH_MAX;
    pm.m.visible = pm.sh.visible = vis && !(view === 'first' && k === 0);   // not his own body, from inside
    if (!vis) return;
    pm.m.position.copy(M2W(tk, parity(k) * r, mobius.z + PH / 2)); pm.sh.position.copy(M2W(tk, parity(k) * r, 0.015));
  });
  tube.set(x => sigma(euclid.u, euclid.v, x) - W, x => sigma(euclid.u, euclid.v, x) + W, euclid.z, PH);

  const Wd = renderer.domElement.clientWidth, Hd = renderer.domElement.clientHeight;
  const wE = Math.round(Math.min(Wd * 0.42, Hd * 1.05)), wM = Wd - wE;
  splitX = wE;
  document.getElementById('divider').style.left = wE + 'px';
  document.getElementById('hudE').style.width = wE + 'px'; document.getElementById('hudM').style.width = wM + 'px';
  camE.fov = camM.fov = view === 'first' ? 72 : view === 'chase' ? 60 : 42;
  camE.aspect = wE / Hd; camE.updateProjectionMatrix();
  camM.aspect = wM / Hd; camM.updateProjectionMatrix();
  if (view === 'first') {
    placeEye(camE, E2W(euclid.u, euclid.v, euclid.z + EYE), euclid);
    placeEye(camM, M2W(th, r, mobius.z + EYE), mobius);
    xh.E.style.left = (wE / 2) + 'px'; xh.E.style.top = (Hd / 2) + 'px';
    xh.M.style.left = (wE + wM / 2) + 'px'; xh.M.style.top = (Hd / 2) + 'px';
  } else if (view === 'chase') {
    placeChase(camE, E2W(euclid.u, euclid.v, euclid.z + CHASE_AIM), euclid);
    placeChase(camM, M2W(th, r, mobius.z + CHASE_AIM), mobius);
  } else {
    camE.rotation.set(0, 0, 0);
    camE.position.set(0, 17.6, 5.9); camE.lookAt(0, 0, 0);
    const m = M2W(th, 0, 0);
    camM.rotation.set(0, 0, 0);
    camM.position.set(m.x, 13.5, 3.6); camM.lookAt(m.x, 0, 0);
  }
  renderer.setViewport(0, 0, wE, Hd); renderer.setScissor(0, 0, wE, Hd); renderer.render(scene, camE);
  renderer.setViewport(wE, 0, wM, Hd); renderer.setScissor(wE, 0, wM, Hd); renderer.render(scene, camM);
  requestAnimationFrame(frame);
}
function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); }
addEventListener('resize', resize); resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
