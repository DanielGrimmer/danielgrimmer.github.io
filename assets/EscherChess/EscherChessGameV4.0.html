<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Escher Chess (V4.0)</title>
    <link rel="stylesheet" href="../games/ui/board.css?v=4.4.0" />
  </head>
  <body class="dg">
    <div class="dg-wrap">
      <header class="dg-masthead">
        <div>
          <h1 id="sideTitle">Escher Chess</h1>
          <div class="dg-sub" id="sideSub">Connecting…</div>
        </div>
        <a href="/escher-chess/">← Escher Chess</a>
      </header>

      <div class="dg-layout" id="playLayout">
        <div class="dg-coach" id="coach" aria-live="polite">
          <div class="dg-coach-progress" id="coachProgress">Room</div>
          <h2 class="dg-coach-title" id="roomName">…</h2>
          <p class="dg-coach-body" id="coachBody">Finding you a room…</p>

          <div class="dg-room-tools" id="roomTools" hidden>
            <button class="dg-btn dg-btn-primary" id="copyLink" type="button">
              Copy the invite link
            </button>
            <label class="dg-join">
              Or join a room by name:
              <span class="dg-join-row">
                <input id="roomInput" list="roomList" placeholder="GreenField" autocomplete="off" />
                <button class="dg-btn" id="joinRoom" type="button">Join</button>
              </span>
            </label>
            <datalist id="roomList"></datalist>
          </div>
        </div>

        <div class="dg-play">
          <div class="dg-status" id="status">Connecting…</div>
          <div class="dg-presence" id="presence"></div>
          <div id="board"></div>
          <p class="dg-legend" id="fileNote"></p>
        </div>
      </div>

      <!--
        The reveal. Hidden until the game is over, and then it replaces the
        board rather than sitting under it: there is nothing left to play, and
        the two replay boards want the whole width.
      -->
      <section id="replay" hidden>
        <div class="dg-replay-intro">
          <div class="dg-status" id="replayStatus"></div>
          <div class="dg-coach dg-coach-band" id="replayCoach">
            <div class="dg-coach-progress">The Big Reveal</div>
            <h2 class="dg-coach-title" id="replayTitle"></h2>
            <p class="dg-coach-body" id="replayBody"></p>
          </div>
        </div>
        <div id="replayStage"></div>
        <!--
          The questions the boards raise, kept until after somebody has stepped
          through them. Reaching the boards quickly is what makes the reveal
          land; this keeps perfectly well until afterwards.
        -->
        <div class="dg-replay-intro">
          <div class="dg-coach dg-coach-band">
            <p class="dg-coach-body" id="replayAfter"></p>
          </div>
        </div>
        <!--
          Where to go once the reveal has landed: the other board, in this same
          room. Both players press their own copy of this button and both end up
          in the same game, because the room is where the board is recorded.
        -->
        <div class="dg-bar dg-bar-main">
          <button class="dg-btn dg-btn-primary" id="otherBoard" type="button"></button>
        </div>
      </section>

      <div class="dg-bar dg-bar-main">
        <button class="dg-btn" id="newGame" type="button" hidden>New game</button>
        <button class="dg-btn" id="leave" type="button" hidden>Leave this room</button>
      </div>

      <p class="dg-legend dg-build">Build <span id="buildStamp">—</span></p>
    </div>

    <script type="module">
      const BUILD = '4.4.0';

      import { BOARDS, NARROW, WIDE, SIDE } from '../games/escher/presets.js?v=4.4.0';
      import {
        initialGame,
        replay,
        replayFrames,
        viewOf,
        fromView,
        STATUS,
      } from '../games/escher/game.js?v=4.4.0';
      import {
        presenceOf,
        seatOf,
        normaliseSeats,
        occupancy,
        mayMove,
        PRESENCE,
      } from '../games/core/seats.js?v=4.4.0';
      import { createChessboard } from '../games/ui/chessboard.js?v=4.4.0';
      import { createReplayView } from '../games/ui/replay.js?v=4.4.0';
      import { revealNote } from '../games/escher/coach.js?v=4.4.0';
      import {
        ROOM_NAMES,
        roomFromLocation,
        shareLink,
        rememberRoom,
        recallRoom,
        emptyEscherRoomDoc,
        LAST_ESCHER_KEY,
      } from '../games/net/rooms.js?v=4.4.0';
      import {
        signIn,
        escher,
        explain,
        HEARTBEAT_MS,
        ACTIVE_HEARTBEAT_MS,
      } from '../games/net/room.js?v=4.4.0';

      const el = (id) => document.getElementById(id);
      const SIDE_NAME = ['White', 'Black'];

      /*
       * Which board this room is played on.
       *
       * The narrow one unless the link says otherwise; the booklets advise
       * learning on it, and it is the one the tutorial teaches. A room that
       * already exists keeps whatever board it was created with — changing it
       * mid-game would invalidate every move in the log, and the Security Rules
       * refuse it for the same reason.
       */
      const wantedBoard = BOARDS[new URLSearchParams(location.search).get('board')] ?? NARROW;

      let uid = null;
      let room = null; // the room's name
      let seat = null; // 0 (White), 1 (Black), or null for a spectator
      let board = wantedBoard;
      let state = { seats: normaliseSeats([]), moves: [] };
      let game = initialGame(board);
      let boardView = null;
      let replayView = null;
      let replayKey = null; // what the replay on screen is currently showing
      /*
       * True when the game in this room was already finished at the moment we
       * sat down — somebody else's game, which we have no business being shown
       * the reveal of. Cleared the moment a fresh game starts, which is the one
       * way the log can return to empty.
       */
      let inheritedGame = false;
      let unwatch = null;
      let interacted = false; // has anyone touched this tab since the last beat

      const now = () => Date.now();
      const other = (s) => (s === 0 ? 1 : 0);

      /* ---------------------------------------------------------- rendering */

      function describeOpponent() {
        if (seat === null) return '';
        const them = state.seats[other(seat)];
        switch (presenceOf(them, now())) {
          case PRESENCE.EMPTY:
            return 'Nobody else is here yet.';
          case PRESENCE.ACTIVE:
            return 'Your friend is here, and moving about.';
          case PRESENCE.IDLE:
            return 'Your friend is here but has been still for a while.';
          case PRESENCE.GONE:
            return 'Your friend has stopped responding. Their seat frees up after five minutes.';
          default:
            return '';
        }
      }

      function describeStatus() {
        if (seat === null) {
          return 'Both seats in this room are taken — you are watching. Join another room to play.';
        }
        // The result comes first: a finished game stays finished even after the
        // other player closes their tab, and the replay underneath would look
        // absurd above the words "waiting for a second player".
        const callThem = 'Call your friend, to talk through your respective experiences.';
        if (game.outcome.status === STATUS.CHECKMATE) {
          return game.outcome.winner === seat
            ? `Checkmate — you win! ${callThem}`
            : `Checkmate. Your friend wins. ${callThem}`;
        }
        if (game.outcome.status === STATUS.STALEMATE) {
          return `Stalemate — nobody can move, and it is a draw. ${callThem}`;
        }
        const full = occupancy(state.seats, now()).held === 2;
        if (!full) return 'Waiting for a second player to join this room.';

        const check = viewOf(board, game, seat).check;
        if (game.turn === seat) {
          return check ? 'Your move — and you are in check.' : 'Your move.';
        }
        return "Your friend's move.";
      }

      function draw() {
        game = replay(board, state.moves);
        const lens = seat ?? SIDE.WHITE;

        if (!boardView) {
          boardView = createChessboard(el('board'), {
            width: board.width,
            height: board.height,
            label: `Your board — ${board.files[lens].join(' ')}`,
          });
        }

        // `mayMove` asks whether this uid holds *the seat on move* and is still
        // beating, which is the same question the Security Rule asks.
        const full = occupancy(state.seats, now()).held === 2;
        const mayMoveNow =
          full &&
          game.outcome.status === STATUS.PLAYING &&
          mayMove(state.seats, { uid, turn: game.turn, now: now() });

        boardView.render(viewOf(board, game, lens), {
          onMove: mayMoveNow
            ? async (move) => {
                const played = {
                  from: fromView(board, lens, move.from),
                  to: fromView(board, lens, move.to),
                  // Never undefined: Firestore refuses it, and the log has to
                  // read back the same way it went in.
                  promote: move.promote ?? null,
                };
                try {
                  await escher.append({
                    name: room,
                    uid,
                    move: played,
                    expectedLength: state.moves.length,
                  });
                } catch (err) {
                  // Someone moved first, or the rules refused it. The snapshot
                  // that follows is the truth; say so rather than freezing.
                  el('status').textContent = `That move did not take: ${explain(err)}`;
                }
              }
            : null,
        });

        el('status').textContent = inheritedGame
          ? 'This room still has somebody else’s finished game in it. Press ' +
            '“New game” to clear the board and start your own.'
          : describeStatus();
        el('status').dataset.tone =
          !inheritedGame && game.outcome.status === STATUS.CHECKMATE ? 'win' : '';
        el('presence').textContent = describeOpponent();
        el('fileNote').textContent =
          `Your files are named ${board.files[lens].join(', ')}, left to right. ` +
          'Announce your moves by file and rank, and nothing else.';
        el('newGame').hidden = seat === null || game.outcome.status === STATUS.PLAYING;
        el('leave').hidden = seat === null;
        drawReplay();
      }

      /*
       * The reveal, shown in place of the board once there is nothing left to
       * play.
       *
       * Rebuilt only when what it is showing changes. Every heartbeat delivers a
       * fresh snapshot and calls draw(), so rebuilding unconditionally would
       * throw the viewer back to the opening position once a minute while they
       * were still reading their way through it.
       */
      function drawReplay() {
        if (state.moves.length === 0) inheritedGame = false;
        const over = game.outcome.status !== STATUS.PLAYING && !inheritedGame;
        const key = over ? `${room}:${seat}:${state.moves.length}` : null;

        el('playLayout').hidden = over;
        el('replay').hidden = !over;
        // Two boards at full size need more than the site's text measure.
        document.querySelector('.dg-wrap').classList.toggle('dg-wide', over);

        if (key === replayKey) {
          if (over) el('replayStatus').textContent = describeStatus();
          return;
        }
        replayKey = key;

        if (replayView) {
          replayView.destroy();
          replayView = null;
        }
        if (!over) return;

        const note = revealNote(board, seat);
        el('replayTitle').textContent = note.title;
        el('replayBody').textContent = note.body;
        el('replayAfter').textContent = note.after;
        const next = board === NARROW ? WIDE : NARROW;
        el('otherBoard').textContent = `Play again on the ${next.width}×${next.height} board →`;
        el('otherBoard').hidden = seat === null;
        el('replayStatus').textContent = describeStatus();
        el('replayStatus').dataset.tone =
          game.outcome.status === STATUS.CHECKMATE ? 'win' : '';

        // Your own board first, so "the left-hand one" in the note is true for
        // both players even though they hold different seats.
        const order = seat === null ? [SIDE.WHITE, SIDE.BLACK] : [seat, other(seat)];
        const labels = order.map((s, i) => {
          const files = board.files[s].join(' ');
          if (seat === null) return `${SIDE_NAME[s]} — ${files}`;
          return `${i === 0 ? 'Your board' : "Your friend's board"} — ${files}`;
        });

        /*
         * `ui/replay.js` owns the transport and nothing else — it is shared with
         * Soccer Hockey, which has no pieces to draw. The fold, the renderer and
         * the caption are Escher Chess's, and are handed over here.
         */
        const frames = replayFrames(board, state.moves);

        // Built after the section is unhidden: each board measures itself as it
        // is created, and a hidden parent measures as nothing at all.
        replayView = createReplayView(el('replayStage'), {
          moves: state.moves,
          frames,
          seatOrder: order,
          labels,
          createSeatView(mount, s) {
            const view = createChessboard(mount, {
              width: board.width,
              height: board.height,
              interactive: false,
              label: `${SIDE_NAME[s]}'s board`,
            });
            return {
              render: (frame) => view.render(viewOf(board, frame, s)),
              destroy: () => view.destroy(),
            };
          },
          describe(index) {
            if (index === 0) {
              return `The opening position — ${state.moves.length} moves to come`;
            }
            /*
             * The two players name the same square differently only in the
             * sense that its *place* differs; the name itself is shared, which
             * is the point. So the caption uses the name, and the boards show
             * the two places.
             */
            const move = frames[index].lastMove;
            const from = board.files[SIDE.WHITE][move.from.file] + (move.from.rank + 1);
            const to = board.files[SIDE.WHITE][move.to.file] + (move.to.rank + 1);
            return (
              `Move ${index} of ${state.moves.length} — ` +
              `${SIDE_NAME[move.side]} played ${from} to ${to}`
            );
          },
        });
      }

      function drawRoom() {
        el('roomName').textContent = room ?? '…';
        el('roomTools').hidden = false;

        if (seat === null) {
          el('sideTitle').textContent = 'Escher Chess';
          el('sideSub').textContent = 'Both seats taken — you are watching.';
          el('coachBody').textContent =
            'This room is full. Pick another room by name below, or ask your ' +
            'friend for their invite link.';
          return;
        }

        el('sideTitle').textContent = `${SIDE_NAME[seat]} — ${board.width}×${board.height}`;
        el('sideSub').textContent =
          seat === SIDE.WHITE ? 'You move first.' : 'White moves first.';

        const full = occupancy(state.seats, now()).held === 2;
        el('coachBody').textContent = full
          ? 'You are both here. From now until the game is over, the only thing ' +
            'you may tell each other is which piece you moved, from where, to ' +
            'where — by file and rank. Nothing about how your pieces move, and ' +
            'nothing about what you can see.'
          : 'You are the only one here. Send your friend the invite link, or ' +
            'tell them this room name so they can type it in. Once they arrive, ' +
            'the only thing you may say to each other is your moves.';
      }

      /* ------------------------------------------------------------ network */

      async function enterRoom(name) {
        if (unwatch) {
          unwatch();
          unwatch = null;
        }
        if (room && seat !== null) await escher.leave({ name: room, uid });

        room = name;
        const joined = await escher.join({
          name,
          uid,
          now: now(),
          blank: emptyEscherRoomDoc(name, wantedBoard.id),
        });
        seat = joined.seat;
        // Whichever board the room was created with, not the one we asked for.
        board = BOARDS[joined.room.board] ?? wantedBoard;
        state = { seats: normaliseSeats(joined.room.seats), moves: joined.room.moves ?? [] };

        // A different board means a different grid, so the view is rebuilt.
        if (boardView) {
          boardView.destroy();
          boardView = null;
        }

        const query = new URLSearchParams({ room: name });
        if (board !== NARROW) query.set('board', board.id);
        history.replaceState(null, '', `?${query}`);
        if (seat !== null) rememberRoom(window.localStorage, name, LAST_ESCHER_KEY);
        // Whether the game was already over when we arrived, before any of our
        // own moves can have changed it.
        inheritedGame =
          joined.seat !== null &&
          !joined.abandoned &&
          replay(board, state.moves).outcome.status !== STATUS.PLAYING;
        drawRoom();
        draw();

        unwatch = await escher.watch(
          name,
          (next) => {
            state = next;
            // A seat can be lost while away; keep ours honest.
            seat = seatOf(next.seats, uid);
            drawRoom();
            draw();
          },
          (err) => {
            el('status').textContent = `Lost contact with the room. ${explain(err)}`;
          }
        );
      }

      function startBeating() {
        const beat = async () => {
          if (!room || seat === null) return;
          try {
            await escher.beat({ name: room, uid, now: now(), active: interacted });
            interacted = false;
          } catch {
            // A missed beat is survivable; the seat holds for five minutes.
          }
        };

        // Faster while it is your move, so the other side can tell you are there.
        let timer = null;
        const schedule = () => {
          clearTimeout(timer);
          const mine =
            seat !== null && game.turn === seat && game.outcome.status === STATUS.PLAYING;
          timer = setTimeout(
            async () => {
              await beat();
              schedule();
            },
            mine ? ACTIVE_HEARTBEAT_MS : HEARTBEAT_MS
          );
        };
        schedule();

        for (const evt of ['pointermove', 'keydown', 'pointerdown']) {
          window.addEventListener(
            evt,
            () => {
              interacted = true;
            },
            { passive: true }
          );
        }

        // Best effort: a closed tab frees its seat at once rather than in five
        // minutes. It does not always fire, which is why the timeout exists.
        window.addEventListener('pagehide', () => {
          if (room && seat !== null) escher.leave({ name: room, uid });
        });
      }

      /* -------------------------------------------------------------- setup */

      el('copyLink').addEventListener('click', async () => {
        const link = shareLink(location.origin, location.pathname, room);
        try {
          await navigator.clipboard.writeText(link);
          el('copyLink').textContent = 'Link copied';
          setTimeout(() => (el('copyLink').textContent = 'Copy the invite link'), 2000);
        } catch {
          window.prompt('Copy this link:', link);
        }
      });

      el('joinRoom').addEventListener('click', async () => {
        const wanted = el('roomInput').value.trim();
        if (!ROOM_NAMES.includes(wanted)) {
          el('coachBody').textContent = `There is no room called “${wanted}”. Pick one from the list.`;
          return;
        }
        await enterRoom(wanted);
      });

      el('newGame').addEventListener('click', async () => {
        await escher.reset({ name: room });
      });

      /*
       * The same board is fixed for the whole of a game, because a move means
       * nothing without it. A reset empties the log, though, and at that moment
       * there is nothing left for a change of board to invalidate — so this is
       * the one place the size can change, and it changes for both players at
       * once because it is recorded in the room.
       */
      el('otherBoard').addEventListener('click', async () => {
        const next = board === NARROW ? WIDE : NARROW;
        try {
          await escher.reset({ name: room, board: next.id });
        } catch (err) {
          el('replayStatus').textContent = `That did not take: ${explain(err)}`;
        }
      });

      el('leave').addEventListener('click', async () => {
        await escher.leave({ name: room, uid });
        location.href = '/escher-chess/';
      });

      el('roomList').append(
        ...ROOM_NAMES.map((name) => {
          const option = document.createElement('option');
          option.value = name;
          return option;
        })
      );

      el('buildStamp').textContent = BUILD;

      (async () => {
        try {
          uid = await signIn();
          const wanted = roomFromLocation(location.search);
          const name = await escher.choose({
            preferred: wanted,
            remembered: recallRoom(window.localStorage, LAST_ESCHER_KEY),
            uid,
            now: now(),
          });
          await enterRoom(name);
          startBeating();
        } catch (err) {
          // Name the switch that needs flipping rather than the call that failed.
          el('status').textContent = 'The game could not start.';
          el('coachBody').textContent = explain(err);
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
