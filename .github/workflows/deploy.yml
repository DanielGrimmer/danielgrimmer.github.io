# This is what publishes the site. If you are here because GitHub emailed
# about a failed run, read on.
#
# Two Pages workflows can run on the same push, and only one of them is this
# file:
#
#   Deploy site                  <- here. Builds with the project's own
#                                   Gemfile and uploads a Pages artifact.
#   pages build and deployment   <- GitHub's built-in Jekyll builder. Not a
#                                   file in this repository; it shows up as
#                                   `dynamic/pages/pages-build-deployment`.
#
# The built-in one *always fails here and always will*. It builds with the
# `github-pages` gem, whose plugin allowlist does not include al_folio_core,
# jekyll-scholar or jekyll-imagemagick — so it cannot build this site, and its
# failure means nothing about whether the site deployed. The evidence: on every
# recent commit, "Deploy site" succeeded and "pages build and deployment"
# failed, and the live site is current.
#
# To stop the noise: repository Settings -> Pages -> Build and deployment ->
# Source -> **GitHub Actions**. Re-select it even if it already reads that; the
# built-in workflow is triggered by a branch-based source, and a stale setting
# is what leaves it running.
#
# ## If "Deploy site" itself failed
#
# Look at which job died before assuming the commit is at fault. Five of the
# last thirty runs failed, and every one was GitHub's own infrastructure
# rather than the site: 429s from codeload.github.com while downloading an
# action, and 503s from the Pages deployment API. Both are transient and both
# are now retried — the actions/* downloads by the runner itself, the
# deployment by the second attempt at the foot of this file.
#
# The dangerous part is not the failed run, it is the silence afterwards: a
# failed deploy leaves the previous build live, so the site simply stays at an
# older version with nothing on the page to say so. The build stamp at the
# foot of each game page is how to check — if it does not match the version in
# the newest commit, the deploy did not land, and re-running the workflow
# (Actions -> Deploy site -> Run workflow) is the fix.

name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # jekyll-scholar's BibTeX lexer raises "invalid byte sequence in US-ASCII"
      # on any non-ASCII character (accented co-author names, en dashes) unless
      # the whole toolchain runs in a UTF-8 locale.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ImageMagick
        # Required by jekyll-imagemagick, which generates the responsive WebP
        # variants of everything in assets/img/.
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Purge unused CSS
        # If the site ever renders with missing styles, this is the first thing
        # to disable — add the missing class to the safelist in purgecss.config.js.
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Pull requests build but do not deploy.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # Retried, because the failure is usually not ours. The Pages deployment
      # API answers 503 ("No server is currently available… please re-run the
      # deployment at a later time") often enough to matter: it lost the 4.37.0
      # deploy outright, and the only sign was the site quietly staying two
      # builds behind. `error_count` is how many polling errors deploy-pages
      # tolerates once a deployment exists; it does nothing for a 503 on
      # creation, so the retry has to wrap the step.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
