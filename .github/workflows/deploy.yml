name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # jekyll-scholar's BibTeX lexer raises "invalid byte sequence in US-ASCII"
      # on any non-ASCII character (accented co-author names, en dashes) unless
      # the whole toolchain runs in a UTF-8 locale.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ImageMagick
        # Required by jekyll-imagemagick, which generates the responsive WebP
        # variants of everything in assets/img/.
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Purge unused CSS
        # If the site ever renders with missing styles, this is the first thing
        # to disable — add the missing class to the safelist in purgecss.config.js.
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Pull requests build but do not deploy.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
